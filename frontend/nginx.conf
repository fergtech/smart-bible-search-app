server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # This app is actively being edited and rebuilt (local dev/testing,
        # single user) - default nginx/browser caching repeatedly caused a
        # stale HTML/JS/CSS to keep being served after a rebuild, which was
        # mistaken for a real bug more than once. There's no meaningful
        # performance cost to disabling caching here, so it's simpler than
        # remembering to hard-refresh (or cache-bust the URL) after every
        # frontend change.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
